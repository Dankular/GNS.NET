# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      gns_ref:
        description: "Pinned GameNetworkingSockets commit, tag, or branch"
        required: false
        default: "a424b7db649438acafb60c99cae6667587c42732"
        type: string

env:
  GNS_REF: ${{ inputs.gns_ref || 'a424b7db649438acafb60c99cae6667587c42732' }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Generate API reference
      shell: pwsh
      run: ./scripts/generate-api-reference.ps1
    - name: Replay and load smoke benchmark
      run: mkdir -p artifacts && dotnet run --project benchmarks/GnsNet.Benchmarks --no-build -- --scenario all --clients 16 --entities 1000 --iterations 1000 --payload-bytes 128 --deterministic --json artifacts/ci-benchmark.json
    - name: Verify deterministic replay fingerprint
      shell: bash
      run: |
        set -euo pipefail
        dotnet run --project benchmarks/GnsNet.Benchmarks --no-build -- --scenario replay --iterations 1000 --deterministic --json artifacts/replay-a.json
        dotnet run --project benchmarks/GnsNet.Benchmarks --no-build -- --scenario replay --iterations 1000 --deterministic --json artifacts/replay-b.json
        test "$(jq -r '.results[0].fingerprint' artifacts/replay-a.json)" = "$(jq -r '.results[0].fingerprint' artifacts/replay-b.json)"
    - name: Run deterministic managed load matrix
      run: |
        mkdir -p artifacts
        dotnet run --project benchmarks/GnsNet.Benchmarks --no-build -- --scenario matrix --clients 16 --entities 1000 --iterations 100 --payload-bytes 128 --deterministic --json artifacts/matrix-a.json
        dotnet run --project benchmarks/GnsNet.Benchmarks --no-build -- --scenario matrix --clients 16 --entities 1000 --iterations 100 --payload-bytes 128 --deterministic --json artifacts/matrix-b.json
        cmp artifacts/matrix-a.json artifacts/matrix-b.json
    - name: Upload replay and load regression artifact
      uses: actions/upload-artifact@v4
      with:
        name: gnsnet-ci-replay-load-regression
        path: artifacts/ci-benchmark.json
        if-no-files-found: error

  native-auth-capability:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore and build auth contract
      run: dotnet build GnsNet.sln -c Release
    - name: Verify transport requires an explicit insecure switch
      shell: bash
      run: |
        set -euo pipefail
        if dotnet run --project benchmarks/GnsNet.Benchmarks -c Release --no-build -- --scenario transport --clients 1 --iterations 1 >/tmp/gns-auth-switch.log 2>&1; then
          echo "Transport benchmark unexpectedly ran without --insecure" >&2
          cat /tmp/gns-auth-switch.log >&2
          exit 1
        fi
        grep -F -- "pass --insecure explicitly" /tmp/gns-auth-switch.log
    - name: Run managed admission and authentication capability tests
      run: |
        dotnet test tests/GnsNet.Tests/GnsNet.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ConnectionPolicyTests
        dotnet test tests/GnsNet.Tests/GnsNet.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ExternalAuthenticationTests
    - name: Check CI contains no embedded credentials
      shell: bash
      run: |
        set -euo pipefail
        if grep -RInE --exclude='*.md' --exclude='dotnet.yml' --exclude='turn.env.example' --exclude='turn-compose.yml' '(PLAYFAB_SECRET|STEAM.*KEY|TURN.*SECRET|PASSWORD[[:space:]]*[:=]|API_KEY[[:space:]]*[:=])' .github docker; then
          echo "Credential-like value found in native CI configuration" >&2
          exit 1
        fi
    - name: Publish native authentication capability report
      shell: bash
      run: |
        mkdir -p artifacts
        cat > artifacts/native-auth-capability.json <<'JSON'
        {
          "nativeTransportAuthentication": "certificate-api-wired-but-credential-not-provisioned",
          "certificateProvisioningApi": "compiled-and-capability-tested",
          "loopbackMode": "explicit-insecure-only",
          "managedAdmissionAndExternalAuthenticationTests": "passed",
          "embeddedSecrets": false,
          "realSteamworksCertificateTicketValidation": "unsupported-by-open-source-backend",
          "realGnsCertificateValidation": "requires-coordinator-issued-certificate",
          "realNatTurnTraversal": "not-verified"
        }
        JSON
    - name: Upload native authentication capability report
      uses: actions/upload-artifact@v4
      with:
        name: gnsnet-native-auth-capability
        path: artifacts/native-auth-capability.json
        if-no-files-found: error

  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Cache native dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/vcpkg
          native/GameNetworkingSockets
        key: gns-native-linux-${{ env.GNS_REF }}-${{ hashFiles('.github/workflows/dotnet.yml') }}
    - name: Install native build tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev protobuf-compiler
    - name: Fetch GameNetworkingSockets
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d native/GameNetworkingSockets/.git ]; then
          git clone --filter=blob:none https://github.com/ValveSoftware/GameNetworkingSockets.git native/GameNetworkingSockets
        fi
        git -C native/GameNetworkingSockets fetch --depth 1 origin "$GNS_REF"
        git -C native/GameNetworkingSockets checkout --detach FETCH_HEAD
    - name: Install native dependencies
      run: timeout --foreground 30m vcpkg install --triplet x64-linux --debug
      working-directory: native/GameNetworkingSockets
    - name: Configure native transport
      run: cmake -S native/GameNetworkingSockets -B native/build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DGNS_BUILD_TESTS=OFF -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
    - name: Build native transport
      run: cmake --build native/build-linux --config Release --parallel
    - name: Validate and fingerprint Linux artifact
      shell: bash
      run: |
        set -euo pipefail
        artifact="$(find native/build-linux -type f -name 'libGameNetworkingSockets.so*' -print -quit)"
        test -n "$artifact"
        file "$artifact" | grep -E 'ELF 64-bit.*x86-64'
        test "$(stat -c '%s' "$artifact")" -gt 0
        (cd "$(dirname "$artifact")" && sha256sum "$(basename "$artifact")") > native/build-linux/gns-artifact.sha256
    - name: Upload native Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamenetworkingsockets-linux-x64
        path: |
          native/build-linux/**/*.so*
          native/build-linux/gns-artifact.sha256
        if-no-files-found: error

  native-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Cache native dependencies
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.VCPKG_INSTALLATION_ROOT }}
          native/GameNetworkingSockets
        key: gns-native-windows-${{ env.GNS_REF }}-${{ hashFiles('.github/workflows/dotnet.yml') }}
    - name: Install Ninja
      run: choco install ninja --no-progress -y
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
    - name: Fetch GameNetworkingSockets
      shell: pwsh
      run: |
        if (-not (Test-Path native/GameNetworkingSockets/.git)) {
          git clone --filter=blob:none https://github.com/ValveSoftware/GameNetworkingSockets.git native/GameNetworkingSockets
        }
        git -C native/GameNetworkingSockets fetch --depth 1 origin $env:GNS_REF
        git -C native/GameNetworkingSockets checkout --detach FETCH_HEAD
    - name: Install native dependencies
      shell: pwsh
      run: |
        $process = Start-Process -FilePath vcpkg -ArgumentList @("install", "--triplet", "x64-windows", "--debug") -WorkingDirectory (Get-Location) -NoNewWindow -PassThru
        if (-not $process.WaitForExit(30 * 60 * 1000)) {
          $process.Kill($true)
          throw "vcpkg dependency installation exceeded 30 minutes"
        }
        if ($process.ExitCode -ne 0) { throw "vcpkg dependency installation failed with exit code $($process.ExitCode)" }
      working-directory: native/GameNetworkingSockets
    - name: Configure native transport
      shell: pwsh
      run: cmake -S native/GameNetworkingSockets -B native/build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DGNS_BUILD_TESTS=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
    - name: Build native transport
      shell: pwsh
      run: cmake --build native/build-windows --config Release --parallel
    - name: Validate and fingerprint Windows artifact
      shell: pwsh
      run: |
        $artifact = Get-ChildItem -Path native/build-windows -Recurse -Filter GameNetworkingSockets.dll | Select-Object -First 1
        if ($null -eq $artifact) { throw "GameNetworkingSockets.dll was not produced" }
        if ($artifact.Length -le 0) { throw "Native artifact is empty" }
        $bytes = [IO.File]::ReadAllBytes($artifact.FullName)
        if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Native artifact is not a PE image" }
        $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
        if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) { throw "PE signature is invalid" }
        $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
        if ($machine -ne 0x8664) { throw "Expected x64 PE image, machine was 0x{0:X4}" -f $machine }
        (Get-FileHash -Algorithm SHA256 $artifact.FullName).Hash.ToLowerInvariant() + "  " + $artifact.Name | Set-Content native/build-windows/gns-artifact.sha256
    - name: Upload native Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamenetworkingsockets-windows-x64
        path: |
          native/build-windows/**/*.dll
          native/build-windows/gns-artifact.sha256
        if-no-files-found: error

  native-windows-runtime:
    needs: native-windows
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Download Windows native artifact
      uses: actions/download-artifact@v4
      with:
        name: gamenetworkingsockets-windows-x64
        path: native-artifacts/windows
    - name: Build managed Win64 runtime
      shell: pwsh
      run: dotnet build GnsNet.sln -c Release -p:GnsNetBackend=Win64
    - name: Run Windows native loopback smoke
      shell: pwsh
      run: |
        $artifact = Get-ChildItem -Path native-artifacts/windows -Recurse -Filter GameNetworkingSockets.dll | Select-Object -First 1
        if ($null -eq $artifact) { throw "Downloaded GameNetworkingSockets.dll was not found" }
        New-Item -ItemType Directory -Force artifacts | Out-Null
        dotnet run --project benchmarks/GnsNet.Benchmarks -c Release -p:GnsNetBackend=Win64 --no-build -- --scenario transport --insecure --native-path $artifact.FullName --address 127.0.0.1:27991 --clients 2 --iterations 100 --payload-bytes 64 --deterministic --json artifacts/windows-transport-ipv4.json
        dotnet run --project benchmarks/GnsNet.Benchmarks -c Release -p:GnsNetBackend=Win64 --no-build -- --scenario transport --insecure --native-path $artifact.FullName --address "[::1]:27991" --clients 2 --iterations 100 --payload-bytes 64 --deterministic --json artifacts/windows-transport-ipv6.json
    - name: Upload Windows runtime smoke result
      uses: actions/upload-artifact@v4
      with:
        name: gnsnet-windows-runtime-smoke
        path: artifacts/windows-transport-*.json
        if-no-files-found: error

  native-linux-runtime:
    needs: native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Download Linux native artifact
      uses: actions/download-artifact@v4
      with:
        name: gamenetworkingsockets-linux-x64
        path: native-artifacts/linux
    - name: Build managed Linux runtime
      run: dotnet build GnsNet.sln -c Release
    - name: Run Linux native loopback smoke
      shell: bash
      run: |
        set -euo pipefail
        artifact="$(find native-artifacts/linux -type f -name 'libGameNetworkingSockets.so*' -print -quit)"
        test -n "$artifact"
        mkdir -p artifacts
        dotnet run --project benchmarks/GnsNet.Benchmarks -c Release --no-build -- --scenario transport --insecure --native-path "$artifact" --address 127.0.0.1:27991 --clients 2 --iterations 100 --payload-bytes 64 --deterministic --json artifacts/linux-transport-ipv4.json
        dotnet run --project benchmarks/GnsNet.Benchmarks -c Release --no-build -- --scenario transport --insecure --native-path "$artifact" --address '[::1]:27991' --clients 2 --iterations 100 --payload-bytes 64 --deterministic --json artifacts/linux-transport-ipv6.json
    - name: Upload Linux runtime smoke result
      uses: actions/upload-artifact@v4
      with:
        name: gnsnet-linux-runtime-smoke
        path: artifacts/linux-transport-*.json
        if-no-files-found: error

  native-artifact-consumer:
    needs: [native-linux, native-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Download Linux native artifact
      uses: actions/download-artifact@v4
      with:
        name: gamenetworkingsockets-linux-x64
        path: native-artifacts/linux
    - name: Download Windows native artifact
      uses: actions/download-artifact@v4
      with:
        name: gamenetworkingsockets-windows-x64
        path: native-artifacts/windows
    - name: Verify native artifact payloads
      shell: bash
      run: |
        set -euo pipefail
        linux_artifact="$(find native-artifacts/linux -type f -name 'libGameNetworkingSockets.so*' -print -quit)"
        windows_artifact="$(find native-artifacts/windows -type f -name 'GameNetworkingSockets.dll' -print -quit)"
        test -n "$linux_artifact"
        test -n "$windows_artifact"
        test -f "$(find native-artifacts/linux -type f -name 'gns-artifact.sha256' -print -quit)"
        test -f "$(find native-artifacts/windows -type f -name 'gns-artifact.sha256' -print -quit)"
        file "$linux_artifact" | grep -E 'ELF 64-bit.*x86-64'
        file "$windows_artifact" | grep -E 'PE32\+.*x86-64|PE32\+ executable.*AMD64'
        (cd native-artifacts/linux && sha256sum --check "$(find . -name gns-artifact.sha256 -print -quit)")
        (cd native-artifacts/windows && sha256sum --check "$(find . -name gns-artifact.sha256 -print -quit)")
        test "$(find native-artifacts/windows -type f -name '*.dll' | wc -l)" -ge 1
        echo "Native Linux and Windows artifacts passed identity and architecture validation."
