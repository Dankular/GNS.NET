# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "claude/gracious-hawking-xnxxt5" ]
  pull_request:
    branches: [ "claude/gracious-hawking-xnxxt5" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Replay and load smoke benchmark
      run: dotnet run --project benchmarks/GnsNet.Benchmarks --no-build -- --scenario all --clients 2 --entities 100 --iterations 1000 --payload-bytes 64

  native-linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Cache native dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/vcpkg
          native/GameNetworkingSockets
        key: gns-native-linux-${{ hashFiles('.github/workflows/dotnet.yml') }}
    - name: Install native build tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev protobuf-compiler
    - name: Fetch GameNetworkingSockets
      run: if [ ! -d native/GameNetworkingSockets/.git ]; then git clone --depth 1 --branch master https://github.com/ValveSoftware/GameNetworkingSockets.git native/GameNetworkingSockets; fi
    - name: Install native dependencies
      run: vcpkg install --triplet x64-linux
    - name: Configure native transport
      run: cmake -S native/GameNetworkingSockets -B native/build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DGNS_BUILD_TESTS=OFF -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
    - name: Build native transport
      run: cmake --build native/build-linux --config Release --parallel
    - name: Upload native Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamenetworkingsockets-linux-x64
        path: native/build-linux/**/libGameNetworkingSockets.so*
        if-no-files-found: error

  native-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - name: Cache native dependencies
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.VCPKG_INSTALLATION_ROOT }}
          native/GameNetworkingSockets
        key: gns-native-windows-${{ hashFiles('.github/workflows/dotnet.yml') }}
    - name: Install Ninja
      run: choco install ninja --no-progress -y
    - name: Fetch GameNetworkingSockets
      shell: pwsh
      run: if (-not (Test-Path native/GameNetworkingSockets/.git)) { git clone --depth 1 --branch master https://github.com/ValveSoftware/GameNetworkingSockets.git native/GameNetworkingSockets }
    - name: Install native dependencies
      shell: pwsh
      run: vcpkg install --triplet x64-windows
    - name: Configure native transport
      shell: pwsh
      run: cmake -S native/GameNetworkingSockets -B native/build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DGNS_BUILD_TESTS=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
    - name: Build native transport
      shell: pwsh
      run: cmake --build native/build-windows --config Release --parallel
    - name: Upload native Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamenetworkingsockets-windows-x64
        path: native/build-windows/**/GameNetworkingSockets.dll
        if-no-files-found: error

  native-artifact-consumer:
    needs: [native-linux, native-windows]
    runs-on: ubuntu-latest
    steps:
    - name: Download Linux native artifact
      uses: actions/download-artifact@v4
      with:
        name: gamenetworkingsockets-linux-x64
        path: native-artifacts/linux
    - name: Download Windows native artifact
      uses: actions/download-artifact@v4
      with:
        name: gamenetworkingsockets-windows-x64
        path: native-artifacts/windows
    - name: Verify native artifact payloads
      shell: bash
      run: |
        test -n "$(find native-artifacts/linux -type f -name 'libGameNetworkingSockets.so*' -print -quit)"
        test -n "$(find native-artifacts/windows -type f -name 'GameNetworkingSockets.dll' -print -quit)"
